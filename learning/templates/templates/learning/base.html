<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodLearn | AI Education</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }

            background: white; 
            border-radius: 1rem;

        .btn-primary { background: #4e73df; border: none; padding: 0.8rem; border-radius: 0.5rem; transition: 0.3s; }

        .form-control { padding: 0.75rem; border-radius: 0.5rem; }
    </style>
</head>

    {% include 'learning/navbar.html' %}
    <div class="container mt-5">

    </div>

</html>
