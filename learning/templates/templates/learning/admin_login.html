<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-blue: #007bff; }
        .sidebar { min-height: 100vh; background: #212529; color: white; }
        .nav-link { color: rgba(255,255,255,0.8); }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.1); }
        .stat-card { border-left: 5px solid var(--primary-blue); border-radius: 8px; }
        .chart-container { background: white; border-radius: 8px; padding: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar py-4">
                <h4 class="px-3 mb-4">EduNexus</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'admin_dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Manage Database</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Admin Dashboard</h1>
                    <span class="badge bg-primary p-2">Admin: {{ user.username }}</span>
                </div>

                <div class="row">
                    <div class="col-md-7">
                        <div class="card stat-card shadow-sm p-3 mb-4">
                            <h6>Total Students</h6>
                            <h3>{{ student_count }}</h3>
                        </div>
                        
                        <div class="card shadow-sm p-3">
                            <h5>Recent Registrations</h5>
                            <table class="table table-sm mt-3">
                                <thead>
                                    <tr><th>User</th><th>Email</th></tr>
                                </thead>
                                <tbody>
                                    {% for student in students %}
                                    <tr><td>{{ student.username }}</td><td>{{ student.email }}</td></tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="chart-container shadow-sm">
                            <h5 class="text-center mb-4">Student Mood Analytics</h5>
                            <canvas id="moodChart"></canvas>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('moodChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: {{ mood_labels|safe }},
                datasets: [{
                    label: 'Number of Students',
                    data: {{ mood_values|safe }},
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0'],
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    </script>
</body>
</html>
