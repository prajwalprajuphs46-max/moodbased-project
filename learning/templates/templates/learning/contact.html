{% extends 'learning/base.html' %}

{% block content %}
<style>
    /* 1. Full Screen Background Setup */
    .contact-container {
        background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=2070') no-repeat center center fixed;
        background-size: cover;
        /* Force it to fill the entire height of the screen */
        min-height: 100vh; 
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Removes any default margins from parent containers */
        margin: 0;
        padding: 120px 20px;
        position: absolute;
        top: 0;
        left: 0;
    }

    /* 2. Professional Card (Solid White) */
    .contact-card {
        background-color: #ded9d9;
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        color: #333333;
        z-index: 1;
    }

    .icon-circle {
        width: 50px;
        height: 50px;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 1.2rem;
    }

    .contact-info-text {
        color: #4b6e8a;
        margin-bottom: 0;
    }
</style>

<div class="contact-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card contact-card p-5">
                    <div class="text-center mb-4">
                        <div class="display-5 text-primary mb-2">
                            <i class="bi bi-envelope-paper"></i> 
                        </div>
                        <h2 class="fw-bold">Contact Us</h2>
                        <p class="text-muted small">We’re here to help you with your mood-based learning journey.</p>
                    </div>

                    <div class="mt-4">
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-circle me-3">📧</div>
                            <div>
                                <p class="mb-0 fw-bold">Email</p>
                                <a href="mailto:moodlearning26@gmail.com" class="text-primary text-decoration-none">moodlearning26@gmail.com</a>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-circle me-3">📞</div>
                            <div>
                                <p class="mb-0 fw-bold">Phone</p>
                                <p class="contact-info-text">+91 9019615881</p>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-circle me-3">📍</div>
                            <div>
                                <p class="mb-0 fw-bold">Location</p>
                                <p class="contact-info-text">Bengaluru, India</p>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-2">
                        <hr class="mb-4">
                        <a href="{% url 'index' %}" class="btn btn-primary px-4 rounded-pill">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
