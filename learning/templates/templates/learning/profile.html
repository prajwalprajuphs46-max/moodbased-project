{% extends 'learning/navbar.html' %}

{% block title %}My Profile | Mood Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=0D6EFD&color=fff&size=100" class="rounded-circle mb-3" alt="user">
                <h3 class="fw-bold text-capitalize">{{ user.username }}</h3>
                <p class="text-muted">Student | EduNexus Member</p>
            </div>
            <hr>
            <div class="mb-3">
                <label class="small text-muted d-block">Username</label>
                <span class="fw-medium">{{ user.username }}</span>
            </div>
            <div class="mb-3">
                <label class="small text-muted d-block">Email Address</label>
                <span class="fw-medium">{{ user.email|default:"Not provided" }}</span>
            </div>
            <div class="mb-3">
                <label class="small text-muted d-block">Account Status</label>
                <span class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
            </div>
            <a href="{% url 'change_password' %}" class="btn btn-outline-primary w-100 mt-3 rounded-pill">Update Security Settings</a>
        </div>
    </div>
</div>
{% endblock %}
