{% extends 'learning/base.html' %}

{% block content %}
<style>
    .result-viewport {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                    url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .score-circle {
        width: 120px;
        height: 120px;
        border: 5px solid #10b981;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        font-size: 2rem;
        font-weight: 800;
        color: #10b981;
    }

    .btn-certificate {
        background: linear-gradient(45deg, #10b981, #059669);
        color: white;
        border: none;
        padding: 15px;
        font-weight: 700;
        border-radius: 12px;
        transition: transform 0.2s ease;
    }

    .btn-certificate:hover {
        transform: scale(1.03);
        color: white;
    }
</style>

<div class="result-viewport">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                <div class="card glass-card p-5">
                    <div class="mb-4">
                        <i class="fas fa-trophy text-warning mb-3" style="font-size: 4rem;"></i>
                        <h1 class="fw-bold text-dark">Excellent Work!</h1>
                        <p class="text-muted">You have successfully mastered this lesson.</p>
                    </div>

                    <div class="score-circle mb-4">
                        {{ score }}<span style="font-size: 1rem; color: #64748b;">/{{ total }}</span>
                    </div>

                    <div class="d-grid gap-3">
                        {% if certificate %}
                        <a href="{% url 'download_certificate' certificate.id %}" class="btn btn-certificate shadow-sm">
                            <i class="fas fa-file-download me-2"></i> Download My Certificate
                        </a>
                        {% endif %}
                        <a href="{{ review_url }}" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-eye me-1"></i> Review Answers
                        </a>
                        <a href="{% url 'mood_select' %}" class="btn btn-outline-primary rounded-pill">
                            Explore More Courses
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
