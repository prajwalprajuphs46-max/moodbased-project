{% extends 'learning/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450px; border-radius: 15px;">
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">Reset Password</h2>
            <p class="text-muted small">Enter your email address, and we'll send you a link to reset your password.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control py-2" placeholder="name@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none small">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
