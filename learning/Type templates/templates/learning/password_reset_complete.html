{% extends 'learning/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 p-5 text-center" style="width: 100%; max-width: 500px; border-radius: 20px;">
        
        <div class="mb-4">
            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 80px; height: 80px;">
                <i class="bi bi-check-lg" style="font-size: 3rem;"></i>
            </div>
        </div>

        <h2 class="fw-bold text-dark mb-3">Password Changed!</h2>
        <p class="text-muted mb-4">
            Your password has been successfully updated. You can now use your new password to sign in to your <strong>EduNexus</strong> account.
        </p>

        <div class="d-grid">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-bold shadow-sm">
                Go to Login
            </a>
        </div>

        <p class="mt-4 small text-muted">
            If you didn't perform this action, please contact support immediately.
        </p>
    </div>
</div>

<style>
    /* Subtle animation to make the success feel better */
    .card {
        animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
