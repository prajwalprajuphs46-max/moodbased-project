{% extends 'learning/base.html' %}

{% block content %}
<div class="status-wrapper" style="background: linear-gradient(-45deg, #059669, #10B981, #34D399); min-height: 90vh; display: flex; align-items: center; justify-content: center;">
    <div class="status-card shadow-lg" style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); border-radius: 30px; color: white; padding: 50px; text-align: center; max-width: 500px;">
        <div class="icon" style="font-size: 70px; color: #ffffff;"><i class="fas fa-check-circle"></i></div>
        <h1 class="fw-bold">Payment Successful!</h1>
        <hr style="border-color: rgba(255,255,255,0.3)">
        <p>Transaction ID: <br><strong>{{ payment_id }}</strong></p>
        <p class="opacity-75">Your journey to learning starts now. Your course has been unlocked!</p>
        
        <a href="{% url 'course_videos' course_id %}" class="btn btn-light rounded-pill fw-bold w-100 mt-3 p-3">
            <i class="fas fa-play-circle me-2"></i>Start Learning Now
        </a>
    </div>
</div>
{% endblock %}
