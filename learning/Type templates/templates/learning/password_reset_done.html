{% extends 'learning/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-5 mx-auto text-center" style="max-width: 500px; border-radius: 15px;">
        <div class="mb-4">
            <i class="bi bi-envelope-check text-success" style="font-size: 3rem;"></i>
        </div>
        <h3 class="fw-bold">Check Your Email</h3>
        <p class="text-muted">
            We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive it shortly.
        </p>
        <p class="small text-muted mt-2">
            Be sure to check your spam folder if you don't see it!
        </p>
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn btn-outline-primary px-4">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
